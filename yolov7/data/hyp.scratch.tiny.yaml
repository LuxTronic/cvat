# ===== Optimizer =====
lr0: 0.001
lrf: 0.1
momentum: 0.937
weight_decay: 0.0005

# ===== Warmup =====
warmup_epochs: 0.5
warmup_momentum: 0.8
warmup_bias_lr: 0.1

# ===== Loss =====
box: 0.05
cls: 0.3
cls_pw: 1.0
obj: 0.7
obj_pw: 1.0
iou_t: 0.30
anchor_t: 4.0
fl_gamma: 0.0

# ===== Color Augmentation =====
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4

# ===== Geometric Augmentation (GRID-SAFE) =====
degrees: 0.0
translate: 0.05
scale: 0.15
shear: 0.0
perspective: 0.0

# ===== Flips =====
flipud: 0.0
fliplr: 0.5

# ===== Disable heavy aug =====
mosaic: 0.0
mixup: 0.0
copy_paste: 0.0
paste_in: 0.0

# ===== Loss computation =====
loss_ota: 0
