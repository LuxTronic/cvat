[tool.isort]
profile = "black"
forced_separate = ["tests"]
line_length = 100
skip_gitignore = true # align tool behavior with Black
extend_skip=[
    # Correctly ordering the imports in serverless functions would
    # require a pyproject.toml in every function; don't bother with it for now.
    "serverless",
    # Vendored upstream YOLOv7; reformatting it would make future syncs painful.
    "yolov7",
]

[tool.black]
line-length = 100
target-version = ['py310']
# Vendored upstream YOLOv7; reformatting it would make future syncs painful.
extend-exclude = '^/yolov7/'

