[program:smokescreen]
; --allow-self-connections lets an operator --allow-address match an IP on
; this host. Put the storage port in that rule. A rule with no port allows
; every port on the address. Other private addresses stay denied.
; The config file raises the 5m transfer deadlines. The listen port stays 4750.
command=smokescreen --listen-ip=127.0.0.1 --allow-self-connections --config-file=/opt/cvat/supervisord/reusable/smokescreen.yaml %(ENV_SMOKESCREEN_OPTS)s
